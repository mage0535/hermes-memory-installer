global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

# Example scrape URL:
# http://127.0.0.1:9500/metrics?token=replace-with-dashboard-token

scrape_configs:
  - job_name: hermes-memory
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - 127.0.0.1:9500
    params:
      token:
        - replace-with-dashboard-token
